[package]
name = "twiki"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal Wikipedia reader"
license = "MIT"
readme = "README.md"
repository = "https://github.com/14096/twiki"
homepage = "https://github.com/14096/twiki"
keywords = ["wikipedia", "tui", "terminal", "reader", "cli"]
categories = ["command-line-utilities"]
exclude = ["target", "Makefile"]

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
scraper = "0.22"
urlencoding = "2"
anyhow = "1"
unicode-width = "0.2"
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
